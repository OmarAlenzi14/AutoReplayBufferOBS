name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller PySide6 pystray Pillow psutil obsws-python

      - name: Build EXE
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name AutoReplayBuffer --icon icon.ico main.py

      - name: Package files
        shell: pwsh
        run: |
          Copy-Item data.json dist/AutoReplayBuffer/data.json
          Copy-Item icon.ico dist/AutoReplayBuffer/icon.ico
          Compress-Archive -Path "dist/AutoReplayBuffer/*" -DestinationPath "AutoReplayBufferOBS-windows-x64.zip"

      - name: Upload EXE package
        uses: actions/upload-artifact@v4
        with:
          name: AutoReplayBufferOBS-windows-x64
          path: AutoReplayBufferOBS-windows-x64.zip
